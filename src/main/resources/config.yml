# =====================================================================
#  StealASpawner - config.yml
#  Mọi giá trị dưới đây có thể chỉnh sửa rồi chạy "/sas reload".
#  Thay đổi liên quan tới cấu trúc dữ liệu (DB) KHÔNG reload được, cần
#  khởi động lại server để tạo lại bảng nếu bạn đổi "database.file".
# =====================================================================

# Tên file SQLite, đặt trong thư mục dữ liệu của plugin (plugins/StealASpawner/).
database:
  file: "spawners.db"

# Thời gian (giây) kể từ lúc đặt spawner mà chỉ chủ sở hữu mới được phá.
# Trong khoảng thời gian này, người khác cố phá sẽ bị chặn + báo đang được bảo vệ.
grace-period-seconds: 300

# Chu kỳ (giây) giữa mỗi lần cộng tiền thụ động cho TẤT CẢ spawner đã đặt,
# kể cả khi chủ sở hữu đang offline. Số tiền mỗi spawner = base-income[loại mob] * hệ số Yield.
income-interval-seconds: 20

# Chu kỳ (phút) ghi toàn bộ cache spawner xuống SQLite (async). Dữ liệu cũng
# luôn được ghi ngay lập tức khi đặt/trộm/nâng cấp - đây chỉ là lớp an toàn
# phòng khi server crash giữa 2 lần ghi tức thời đó.
autosave-interval-minutes: 5

# Bán kính (block) để broadcast actionbar "X đã trộm spawner của Y" cho người chơi gần đó.
broadcast-radius: 50

# Số level tối đa cho MỖI track (speed/yield/capacity). Vượt effect-cap của track đó,
# nâng cấp vẫn tốn tiền và tăng nominal level (leaderboard/flex) nhưng không còn tăng
# hiệu ứng thật trong game.
max-level: 1000

# ---------------------------------------------------------------------
# TỈ LỆ RỚT SPAWNER KHI GIẾT MOB (0.02 = 2%). Roll bằng ThreadLocalRandom.
# Mob không liệt kê ở đây sẽ KHÔNG BAO GIỜ rớt spawner.
# ---------------------------------------------------------------------
drop-rates:
  ZOMBIE: 0.02
  HUSK: 0.02
  DROWNED: 0.02
  SKELETON: 0.02
  STRAY: 0.02
  WITHER_SKELETON: 0.008
  SPIDER: 0.02
  CAVE_SPIDER: 0.015
  CREEPER: 0.015
  ENDERMAN: 0.003
  BLAZE: 0.005
  WITCH: 0.01
  SLIME: 0.015
  MAGMA_CUBE: 0.012
  SILVERFISH: 0.01
  ENDERMITE: 0.006
  GUARDIAN: 0.004
  ELDER_GUARDIAN: 0.0015
  PILLAGER: 0.012
  VINDICATOR: 0.01
  EVOKER: 0.004
  RAVAGER: 0.002
  PHANTOM: 0.01
  SHULKER: 0.0015
  HOGLIN: 0.012
  PIGLIN: 0.012

# ---------------------------------------------------------------------
# THU NHẬP CƠ BẢN MỖI CHU KỲ (income-interval-seconds) cho spawner của
# từng loại mob, TRƯỚC khi nhân hệ số Yield. Dùng cho mob không nằm
# trong drop-rates cũng được, vì chủ yếu phục vụ /spawnershop.
# ---------------------------------------------------------------------
base-income:
  ZOMBIE: 2.0
  HUSK: 2.0
  DROWNED: 2.5
  SKELETON: 2.0
  STRAY: 2.5
  WITHER_SKELETON: 12.0
  SPIDER: 2.0
  CAVE_SPIDER: 2.5
  CREEPER: 3.0
  ENDERMAN: 10.0
  BLAZE: 8.0
  WITCH: 6.0
  SLIME: 1.5
  MAGMA_CUBE: 2.0
  SILVERFISH: 1.0
  ENDERMITE: 1.0
  GUARDIAN: 7.0
  ELDER_GUARDIAN: 20.0
  PILLAGER: 4.0
  VINDICATOR: 5.0
  EVOKER: 15.0
  RAVAGER: 25.0
  PHANTOM: 5.0
  SHULKER: 18.0
  HOGLIN: 5.0
  PIGLIN: 4.0

# ---------------------------------------------------------------------
# GIÁ MUA SPAWNER MỚI (level 1 mọi track) TRONG /spawnershop.
# Chỉ các loại liệt kê ở đây mới xuất hiện trong GUI shop.
# ---------------------------------------------------------------------
shop:
  ZOMBIE: 5000.0
  SKELETON: 5000.0
  SPIDER: 5500.0
  CREEPER: 6500.0
  ENDERMAN: 25000.0
  BLAZE: 20000.0
  WITCH: 15000.0
  GUARDIAN: 18000.0
  PILLAGER: 10000.0
  PHANTOM: 12000.0

# ---------------------------------------------------------------------
# 3 TRACK NÂNG CẤP. Công thức cost áp dụng chung:
#   cost(level) = base-cost * (1 + level * growth-rate) * (1 + level / soft-cap-level)
# "cost(level)" là giá để đi từ "level" lên "level + 1".
# Sau soft-cap-level, cost tăng rõ rệt hơn hẳn - đẩy số đông dừng lại ở
# vùng "hợp lý", chỉ ai cày sâu mới chạm level 1000.
#
# effective-level = min(nominal-level, effect-cap)  -> dùng để tính số liệu thật.
# Vượt effect-cap, nominal-level vẫn tăng (leaderboard/prestige) nhưng
# effective-level đứng yên, không còn lợi ích thật.
# ---------------------------------------------------------------------
tracks:
  speed:
    base-cost: 150.0
    growth-rate: 0.08
    soft-cap-level: 200
    effect-cap: 60
    # Delay ban đầu (ticks, 20 ticks = 1s) khi effective level = 0. Vanilla
    # spawner mặc định dao động 200-800 ticks (10-40s); 400 ticks = 20s là
    # điểm giữa hợp lý để làm mốc "chưa nâng cấp gì".
    base-delay-ticks: 400
    # Delay sàn — KHÔNG BAO GIỜ xuống dưới mức này dù effective level kịch trần,
    # để một spawner full speed vẫn không phá cân bằng rate sinh mob của server.
    min-delay-ticks: 20
    # delay = base-delay-ticks * (decay-factor ^ effective-level), rồi clamp >= min-delay-ticks.
    decay-factor: 0.985

  yield:
    base-cost: 120.0
    growth-rate: 0.08
    soft-cap-level: 200
    # Yield không cap hiệu ứng thật (effect-cap = max-level) vì đây là tiền ảo,
    # tăng tuyến tính theo level không có rủi ro phá hiệu năng server.
    effect-cap: 1000
    # income = base-income[loại mob] * (1 + income-per-level * effective-level)
    income-per-level: 0.01

  capacity:
    base-cost: 180.0
    growth-rate: 0.08
    soft-cap-level: 200
    effect-cap: 20
    # maxNearbyEntities ban đầu (effective level = 0).
    base-cap: 6
    # maxNearby = min(base-cap + effective-level, hard-cap-server)
    hard-cap-server: 30

# =====================================================================
#  TIN NHẮN — hỗ trợ định dạng MiniMessage (<red>, <bold>, <gradient>...).
# =====================================================================
messages:
  prefix: "<dark_gray>[<gold>StealASpawner<dark_gray>]<gray> "
  no-permission: "<red>Bạn không có quyền làm việc này."
  reload-done: "<green>Đã reload config.yml."
  spawner-dropped: "<yellow>Một spawner <white><entity><yellow> đã rơi ra!"
  grace-protected: "<red>Spawner này vẫn đang được bảo vệ, thử lại sau."
  need-silk-touch: "<red>Cần cuốc có Silk Touch để lấy trộm spawner này."
  steal-broadcast: "<gold><thief> <yellow>đã trộm spawner <white><entity> <gray>(S<speed>/Y<yield>/C<capacity>)<yellow> của <white><owner><yellow>!"
  spawner-placed: "<green>Đã đặt spawner <white><entity><green>. Chủ sở hữu: bạn."
  not-your-spawner: "<red>Đây không phải spawner của bạn (và bạn chưa được trust)."
  not-looking-at-spawner: "<red>Bạn cần nhìn thẳng vào một spawner đã đặt."
  insufficient-funds: "<red>Không đủ tiền. Cần <white><cost><red>, bạn có <white><balance>."
  upgrade-success: "<green>Đã nâng <white><track><green> lên level <white><level><green> (-<white><cost><green>)."
  max-level-reached: "<yellow>Track này đã đạt level tối đa (<white><max><yellow>)."
  trust-added: "<green>Đã trust <white><player><green>. Người này có thể lấy spawner của bạn mà không bị tính là trộm."
  merge-success: "<green>✦ Đã gộp lồng! <white>Speed <speed> | Yield <yield> | Capacity <capacity>"
  merge-wrong-type: "<red>Lồng cầm trên tay khác loại quái, không thể gộp."
  no-economy: "<red>Server chưa cài Vault + plugin economy, chức năng kinh tế bị vô hiệu hoá."
